id: construction
name: Construction
version: 0.1.15
publisher: cbferrum
summary: "Estimates, contracts with variations, progress claims with retention invoiced through ERP, and site diaries"
description: README.md
categories: [projects, finance]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-construction
support: https://github.com/CBFerrum/ferrum-app-construction/issues
runtime: native
platform: ">=0.3.2, <0.4"
# Records of ERP (customers, items, invoices): installing it installs ERP.
requires: {erp: ">=0.1"}
packages: [construction]
uninstall: ask
# Its own interface at /construction/: each contract with what is certified, held and due.
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: construction
      route: construction
      title: Construction
      description: Estimates, contracts, variations, claims and the site diary
      icon: hard-hat
      color: "#a16207"
      roles: [Contracts Manager, Site Manager]
  shell.open:
    - {id: construction, package: construction, path: "construction/e/{entity}/{id}", list: "construction/e/{entity}"}
  shell.create:
    - {id: estimate, label: Estimate, path: construction/e/Estimate/new, entity: Estimate}
    - {id: diary, label: Site Diary, path: construction/e/SiteDiary/new, entity: SiteDiary}
  # What the assistant should know in Construction's pages, and what it suggests asking there.
  shell.assistant:
    - id: construction
      title: "Construction"
      instructions: >-
        An Estimate (Draft, Sent, Accepted, Declined) becomes a ConstructionContract when accepted. A Variation
        (Draft, Submitted, Approved, Rejected) changes a contract's sum once approved. A ProgressClaim is Certified
        when the work claimed is agreed, and is invoiced through ERP with the contract's retention held back: what is
        owed is those invoices' outstanding amount. A SiteDiary records each day on site.
      suggestions:
        - "What is each active contract worth with its approved variations?"
        - "Which progress claims wait to be certified?"
        - "How much retention is held on our contracts?"
        - "What happened on site this week?"
