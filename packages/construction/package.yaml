package: construction
version: 0.1.0
label: Construction
description: "Estimates, contracts with variations, progress claims with retention invoiced through ERP, and site diaries"
depends: [core, selling, buying, accounting, project_records]

modules:
  - name: construction
    label: Construction
    icon: hard-hat
    order: 52
    items: [ConstructionContract, Estimate, Variation, ProgressClaim, Subcontract, SubcontractClaim, SiteDiary, ConstructionSettings, report:construction_margin]

roles:
  - name: Contracts Manager
    description: Prices estimates, runs contracts and their variations, and certifies progress claims.
    permissions:
      - {entity: ConstructionSettings, read: true, write: true, create: true}
      - {entity: Estimate, read: true, write: true, create: true, export: true}
      - {entity: ConstructionContract, read: true, write: true, create: true, export: true}
      - {entity: Variation, read: true, write: true, create: true, export: true}
      - {entity: ProgressClaim, read: true, write: true, create: true, export: true}
      - {entity: SiteDiary, read: true, write: true, create: true}
      - {entity: Customer, read: true, write: true, create: true}
      - {entity: Project, read: true}
      - {entity: Item, read: true}
      - {entity: Company, read: true}
      - {entity: SalesInvoice, read: true, create: true}
      - {entity: Subcontract, read: true, write: true, create: true, export: true}
      - {entity: SubcontractClaim, read: true, write: true, create: true, export: true}
      - {entity: Supplier, read: true}
      - {entity: PurchaseInvoice, read: true, create: true}
  - name: Site Manager
    description: Keeps the site diary, raises variations and measures progress claims; sees contracts.
    permissions:
      - {entity: ConstructionContract, read: true}
      - {entity: Variation, read: true, write: true, create: true}
      - {entity: ProgressClaim, read: true, write: true, create: true}
      - {entity: Subcontract, read: true}
      - {entity: SubcontractClaim, read: true, write: true, create: true}
      - {entity: SiteDiary, read: true, write: true, create: true}
      - {entity: Project, read: true}

# Approvals by someone else (FEO-049), the platform's (docs/api.md, "Approvals"): a Contracts Manager other than whoever
# raised the variation or drew up the claim. Submit It asks in the name of whoever made the record, so the policy's
# "never whoever asked" is "never whoever made it"; once approved, the hidden action does the work (the variation
# joins the contract; the claim is certified and invoiced). A change to a claim's measure while it waits starts its
# approval again. A workspace edits these in Customize (more steps, value bands, escalation) without code.
approvals:
  - entity: Variation
    on: {action: approve}
    policy:
      steps:
        - {label: Contracts Manager, approvers: {role: Contracts Manager}}
  - entity: ProgressClaim
    on: {action: certify}
    policy:
      steps:
        - {label: Contracts Manager, approvers: {role: Contracts Manager}}
      reset_on: [period_to, lines]
  - entity: SubcontractClaim
    on: {action: certify}
    policy:
      steps:
        - {label: Contracts Manager, approvers: {role: Contracts Manager}}
      reset_on: [period_to, value_to_date]
